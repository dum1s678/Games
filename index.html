<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <h1>Прокат настольных игр</h1>
    <label for="showHint">Только свободные:</label>
    <input type="checkbox" id="showHint">
    <ul id="gameList"></ul>

    <label for="gameSelect">Игра</label>
    <select id="gameSelect">
        <option value="0">Каркассон</option>
        <option value="1">Доббль</option>
        <option value="2">Шахматы</option>
    </select>

    <label for="borrowerName">Имя посетителя</label>
    <input id="borrowerName" type="text">
    <p id="ErrorName"></p>
    <button id="borrowButton" type="button">Выдать</button>
    <button id="returnButton" type="button">Вернуть</button>
    <br>
    <input type="text" name="" id="NameGame">
    <input type="number" name="" id="QuantityPlayers">
    <button id="addButton" type="button">Добавить игру</button>
    <p id="message"></p>
</body>

</html>
